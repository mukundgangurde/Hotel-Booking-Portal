spring.application.name=hotel-booking-portal
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_booking_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}